apiVersion: v1
kind: ConfigMap
metadata:
  name: lavalink-config
  namespace: discord-bot
data:
  application.yml: |
    server:
      port: 2333
      address: 0.0.0.0
      http2:
        enabled: false
    plugins:
      youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        oauth:
          enabled: true
          refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN}"
        remoteCipher:
          url: "https://cipher.kikkia.dev"
          password: ""
          userAgent: "cleitinrasta"
        # PR 229: mint a per-video / GVS PoToken. The static pot.token +
        # visitorData pair from 1.18.2 is gone on this plugin.
        remotePot:
          url: "http://webpo-generator.discord-bot.svc.cluster.local:8080"
        # WEBEMBEDDED first: it gets a direct googlevideo URL and plays the
        # whole track. WEB / MWEB / TV fall into SABR streams whose attestation
        # never completes, so they cut out ~60s in (the "music stops" bug).
        # Clients that cannot play are skipped; search still uses MUSIC/WEB.
        clients:
          - WEBEMBEDDED
          - MUSIC
          - MWEB
          - WEB
          - TVHTML5_SIMPLY
          - TV
      lavasrc:
        # Spotify links are resolved to metadata, then played from YouTube.
        providers:
          - "ytsearch:\"%ISRC%\""
          - "ytsearch:%QUERY%"
        sources:
          spotify: true
          applemusic: false
          deezer: false
          yandexmusic: false
        spotify:
          # Required for Spotify links: Spotify's anonymous token endpoint no longer works.
          # Create an app at https://developer.spotify.com/dashboard. Empty = Spotify links fail.
          clientId: "${SPOTIFY_CLIENT_ID:}"
          clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
          countryCode: "BR"
          playlistLoadLimit: 6
          albumLoadLimit: 6
          resolveArtistsInSearch: false
    lavalink:
      plugins:
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
          repository: "https://maven.lavalink.dev/releases"
      # Plugin JAR is loaded from /opt/Lavalink/plugins (initContainer).
      # Do not also pull 1.18.2 from Maven — two youtube-plugins will conflict.
      # Rollback to 1.18.2: see docs/youtube-playback.md (one-step git revert) or restore:
      #   plugins:
      #     - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      #       repository: "https://maven.lavalink.dev/releases"
      server:
        password: "youshallnotpass"
        sources:
          youtube: false
          bandcamp: true
          soundcloud: true
          twitch: true
          vimeo: true
          http: true
          local: false
        filters:
          volume: true
          equalizer: true
          karaoke: true
          timescale: true
          tremolo: true
          vibrato: true
          distortion: true
          rotation: true
          channelMix: true
          lowPass: true
        bufferDurationMs: 400
        frameBufferDurationMs: 5000
        opusEncodingQuality: 10
        resamplingQuality: LOW
        trackStuckThresholdMs: 10000
        useSeekGhosting: true
        youtubePlaylistLoadLimit: 6
        playerUpdateInterval: 5
        youtubeSearchEnabled: true
        soundcloudSearchEnabled: true
        gc-warnings: true
    metrics:
      prometheus:
        enabled: false
        endpoint: /metrics
    logging:
      level:
        root: INFO
        lavalink: INFO
        dev.lavalink.youtube: DEBUG
        com.sedmelluq.discord.lavaplayer.tools.http: DEBUG
