apiVersion: apps/v1
kind: Deployment
metadata:
  name: lavalink
  namespace: discord-bot
  labels:
    app: lavalink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lavalink
  template:
    metadata:
      labels:
        app: lavalink
    spec:
      initContainers:
        # Official Lavalink image + this JAR (PR 229). Checksum pins the vendored file.
        - name: fetch-youtube-plugin
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl
              curl -fsSL -o /plugins/youtube-plugin.jar "$PLUGIN_URL"
              chmod 644 /plugins/youtube-plugin.jar
              echo "$PLUGIN_SHA256  /plugins/youtube-plugin.jar" | sha256sum -c
          env:
            - name: PLUGIN_URL
              value: "https://raw.githubusercontent.com/krymancer/cleitinrasta-discord-bot-dotnet/main/third_party/youtube-plugin-pr229-42cc5a2.jar"
            - name: PLUGIN_SHA256
              value: "5956638abc420d9efc32b11c70168da5dda7a71d2df02c7f688e9770e7738bc7"
          volumeMounts:
            - name: plugins
              mountPath: /plugins
        - name: wait-webpo
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl
              i=0
              until curl -fsS http://webpo-generator.discord-bot.svc.cluster.local:8080/health; do
                i=$((i + 1))
                if [ "$i" -gt 80 ]; then
                  echo "timeout waiting for webpo-generator"
                  exit 1
                fi
                echo "waiting for webpo-generator ($i)"
                sleep 3
              done
      containers:
        - name: lavalink
          image: ghcr.io/lavalink-devs/lavalink:4
          ports:
            - containerPort: 2333
          env:
            - name: YOUTUBE_OAUTH_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lavalink-oauth
                  key: refreshToken
          volumeMounts:
            - name: config
              mountPath: /opt/Lavalink/application.yml
              subPath: application.yml
              readOnly: true
            - name: plugins
              mountPath: /opt/Lavalink/plugins
          readinessProbe:
            tcpSocket:
              port: 2333
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: lavalink-config
        - name: plugins
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bot
  namespace: discord-bot
  labels:
    app: discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  template:
    metadata:
      labels:
        app: discord-bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/krymancer/cleitinrasta-discord-bot-dotnet:latest
          imagePullPolicy: Always
          env:
            - name: Discord__Token
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: DISCORD_TOKEN
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
