services:
  webpo:
    build:
      context: ./docker/webpo-generator
    image: ghcr.io/krymancer/cleitinrasta-webpo-generator:yt-pr229
    container_name: webpo-generator
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  lavalink:
    build:
      context: .
      dockerfile: docker/lavalink/Dockerfile
    image: ghcr.io/krymancer/cleitinrasta-lavalink:yt-pr229
    container_name: lavalink
    restart: unless-stopped
    depends_on:
      webpo:
        condition: service_healthy
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./LavaLink/application.yml:/opt/Lavalink/application.yml:ro
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/localhost/2333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: .
    container_name: cleitinrasta-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - Discord__Token=${DISCORD_TOKEN}
      - GoogleMeet__ClientId=${GOOGLE_MEET_CLIENT_ID:-}
      - GoogleMeet__ClientSecret=${GOOGLE_MEET_CLIENT_SECRET:-}
      - GoogleMeet__RefreshToken=${GOOGLE_MEET_REFRESH_TOKEN:-}
      - Alerts__ChannelId=${ALERTS_CHANNEL_ID:-0}
      - Alerts__UserId=${ALERTS_USER_ID:-0}
    volumes:
      # History, saved playlists and the queue snapshot used to resume after restarts.
      - bot-data:/app/data
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pidof dotnet || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bot-data:

networks:
  bot-network:
    driver: bridge
